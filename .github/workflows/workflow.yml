name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'Infra/**'
            app:
              - 'app/**'
  
  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: AWS configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
        
      - name: Generate SSH Key
        run: ssh-keygen -t ed25519 -f /tmp/nat-key -N ""

      - name: Terraform init
        working-directory: Infra
        run: terraform init

      - name: Terraform FMT check
        working-directory: Infra
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: Infra
        run: terraform validate

      - name: terraform plan
        working-directory: Infra
        run: terraform plan -var-file="env-variables/dev.tfvars" -var="public_key_path=/tmp/nat-key.pub"

      - name: terraform apply
        working-directory: Infra
        run: terraform apply -auto-approve -var-file="env-variables/dev.tfvars" -var="public_key_path=/tmp/nat-key.pub"
  
  deploy:
    needs: [changes, terraform]
    if: |
      always() &&
      needs.changes.outputs.app == 'true' &&
      needs.terraform.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: aws configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: aws ECR login
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      
      - name: deploy to ECS
        run: |
          aws ecs update-service --service api --region ${{ secrets.AWS_REGION }} --force-new-deployment --cluster aws-platform-dev-ecs-cluster
