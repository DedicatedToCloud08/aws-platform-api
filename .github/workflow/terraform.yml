name: terraform workflow

on:
  push:
    branches: [main]
    paths:
      - "Infra/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          region: ${{ secrets.AWS_REGION }}

      - name: Terraform Install
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"

      - name: Terraform init
        working-directory: Infra
        run: terraform init

      - name: Terraform fmt check
        working-directory: Infra
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: Infra
        run: terraform validate

      - name: Generate SSH Key
        run: |
          ssh-keygen -t ed25519 -f /tmp/nat-key -N ""
          echo "NAT_KEY_PATH=$(cat /tmp/nat-key.pub)" >> $GITHUB_ENV
      
      - name: terraform plan
        working-directory: Infra
        run: terraform plan -var-file="env-variables/dev.tfvars" -var="public_key_path=/tmp/nat-key.pub"

      - name: terraform apply
        working-directory: Infra
        run: terraform apply -auto-approve -var-file="env-variables/dev.tfvars" -var="public_key_path=/tmp/nat-key.pub"
 